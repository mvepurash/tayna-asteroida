<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Тайна Астероида v3</title>

  <!-- PWA: установка на домашний экран -->
  <link rel="manifest" href="manifest.json?v=20260918a">
  <meta name="theme-color" content="#0a0a12">
  <meta name="description" content="Добывайте кристаллы на астероиде, следите за кислородом и уклоняйтесь от щупалец.">
  <!-- iOS не читает manifest.json, для него отдельные теги -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тайна Астероида">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260918a">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=20260918a">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html {
  background: #000 !important;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game-wrapper {
  /* Строго 9:16 — никакого растяжения */
  position: relative;
  aspect-ratio: 9 / 16;
  /* Вписываем в экран не выходя за границы */
  width: min(100vw, calc(100vh * 9 / 16));
  height: auto;
  max-height: 100vh;
  flex-shrink: 0;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  outline: none;
  background: #0a0a12;
}

</style>
</head>
<body style="background:#000;margin:0;padding:0;">
  <div id="game-wrapper" style="background:#000;">
    <canvas id="game-canvas" style="background:#0a0a12;display:block;"></canvas>
  </div>
  <!-- Yandex Games SDK. Загружается ПЕРЕД игровыми скриптами: game.js на
       событии load проверяет typeof YaGames и инициализирует ysdk.
       Без этого тега SDK никогда не появлялся, и игра всегда работала в
       fallback-режиме (реклама/LoadingAPI/лидерборды недоступны). -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
    <script src="js/i18n.js?v=1459bc5"></script>
  <script src="js/config.js?v=1459bc5"></script>
  <script src="js/map.js?v=1459bc5"></script>
  <script src="js/crew.js?v=1459bc5"></script>
  <script src="js/save.js?v=1459bc5"></script>
  <script src="js/astronaut.js?v=1459bc5"></script>
  <script src="js/tentacles.js?v=1459bc5"></script>
  <script src="js/oxygen.js?v=1459bc5"></script>
  <script src="js/crystals.js?v=1459bc5"></script>
  <script src="js/hud.js?v=1459bc5"></script>
  <script src="js/renderer.js?v=1459bc5"></script>
  <script src="js/input.js?v=1459bc5"></script>
  <script src="js/audio.js?v=1459bc5"></script>
  <script src="js/ui_manager.js?v=1459bc5"></script>
  <script src="js/game.js?v=1459bc5"></script>

  <script>
    // Регистрация service worker — включает установку на домашний экран.
    // НЕ регистрируем внутри Яндекс Игр: там игра работает в их iframe,
    // свой кэш ей не нужен и может конфликтовать с платформой.
    (function () {
      var insideFrame = window.self !== window.top;
      if ('serviceWorker' in navigator && !insideFrame) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (e) {
            console.warn('[PWA] service worker не зарегистрирован:', e);
          });
        });
      }
    })();
  </script>

</body>
</html>
